openapi: 3.1.0
info:
  title: Optional security alternatives
  version: '1.0.0'
paths:
  /tweets/search:
    get:
      operationId: searchTweets
      security:
      - apiKey: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: Search results
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
    bearerAuth:
      type: http
      scheme: bearer
